# Google Cloud Build — alternative to GitHub Actions
# Trigger: connect this repo in Cloud Build console or use:
#   gcloud builds submit --config cloudbuild.yaml --substitutions=COMMIT_SHA=local-build ./backend

substitutions:
  _SERVICE_NAME: corporate-finance-autopilot
  _REPO_NAME: corporate-finance
  _AR_REGION: us
  _DEPLOY_REGION: us-central1

steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "./backend"

  # Push to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
      - "--region"
      - "${_DEPLOY_REGION}"
      - "--platform"
      - "managed"
      - "--memory"
      - "2Gi"
      - "--cpu"
      - "2"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "3"
      - "--timeout"
      - "300"
      - "--allow-unauthenticated"
      - "--set-env-vars"
      - "DEBUG=false,CACHE_DIR=/tmp/cache"
      - "--set-secrets"
      - "TOGETHER_API_KEY=TOGETHER_API_KEY:latest,FRED_API_KEY=FRED_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,LOGO_DEV_TOKEN=LOGO_DEV_TOKEN:latest,FMP_API_KEY=FMP_API_KEY:latest"

images:
  - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:${COMMIT_SHA}"
  - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"